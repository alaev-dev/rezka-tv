name: ИИ-ревью

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ai-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-review-agent:
    if: ${{ github.event.pull_request.user.login != 'renovate[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      verdict: ${{ steps.review.outputs.structured_output }}
      diff_id: ${{ steps.prior.outputs.diff_id }}
      prior: ${{ steps.prior.outputs.prior }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: prior
        name: Правила, прошлый вердикт и прошлые замечания
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE: origin/${{ github.base_ref }}
        run: |
          git show "$BASE:.github/ai-review.md" > .ai-review-rules.md
          git show "$BASE:tools/gates/ai_review_post.py" > "$RUNNER_TEMP/ai_review_post.py"
          diff_id=$(git diff "$BASE...HEAD" -- . ':(exclude)quality/*-baseline.*' | git patch-id --stable | cut -d' ' -f1)
          prior=$(DIFF_ID="$diff_id" python3 "$RUNNER_TEMP/ai_review_post.py" prior)
          echo "diff_id=$diff_id" >> "$GITHUB_OUTPUT"
          echo "prior=$prior" >> "$GITHUB_OUTPUT"
          python3 "$RUNNER_TEMP/ai_review_post.py" previous > .ai-review-previous.json
          gh pr view "$PR_NUMBER" --json title,body -q '"# " + .title + "\n\n" + .body' > "$RUNNER_TEMP/description.md"
          git show "$BASE:tools/gates/ai_review_context.py" > "$RUNNER_TEMP/ai_review_context.py"
          python3 "$RUNNER_TEMP/ai_review_context.py" "$BASE" "$RUNNER_TEMP/description.md"
      - id: review
        name: Ревью одним запросом
        if: ${{ steps.prior.outputs.prior == '' }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MODEL: deepseek-flash
          BASE: origin/${{ github.base_ref }}
        run: |
          git show "$BASE:tools/gates/ai_review_request.py" > "$RUNNER_TEMP/ai_review_request.py"
          verdict=$(python3 "$RUNNER_TEMP/ai_review_request.py")
          { echo "structured_output<<VERDICT_END"; echo "$verdict"; echo "VERDICT_END"; } >> "$GITHUB_OUTPUT"

  ai-review:
    needs: ai-review-agent
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Публикация и вердикт
        env:
          VERDICT: ${{ needs.ai-review-agent.outputs.verdict }}
          DIFF_ID: ${{ needs.ai-review-agent.outputs.diff_id }}
          PRIOR: ${{ needs.ai-review-agent.outputs.prior }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$AUTHOR" = "renovate[bot]" ]; then
            echo "Обновление зависимостей от Renovate: ИИ-ревью не запускается, проверяет verify."
            exit 0
          fi
          if [ -n "$PRIOR" ]; then
            echo "Собственный дифф PR не изменился: вердикт прошлого ревью, блокирующих нарушений: $PRIOR."
            test "$PRIOR" = 0
            exit
          fi
          git fetch --depth 1 origin "${{ github.base_ref }}"
          git show FETCH_HEAD:tools/gates/ai_review_post.py > "$RUNNER_TEMP/ai_review_post.py"
          python3 "$RUNNER_TEMP/ai_review_post.py"
