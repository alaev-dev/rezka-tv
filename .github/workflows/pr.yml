name: Быстрые проверки

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: fast-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.17.2
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew verify
        env:
          PYTHON: python
          GATE_BASE: origin/${{ github.base_ref || 'main' }}
