<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex">
<title>Вход в rezka на телевизоре</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0B0E13; color: #fff; font: 16px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; padding: 20px; }
  main { width: 100%; max-width: 380px; background: #161B23; border-radius: 16px; padding: 28px 22px; }
  h1 { margin: 0 0 6px; font-size: 22px; }
  p.hint { margin: 0 0 22px; color: #9AA4B2; font-size: 14px; }
  label { display: block; margin: 14px 0 6px; color: #9AA4B2; font-size: 14px; }
  .field { position: relative; }
  input { width: 100%; padding: 13px 14px; border-radius: 10px; border: 1px solid #2C3440; background: #0B0E13;
          color: #fff; font-size: 17px; outline: none; }
  input:focus { border-color: #FFB300; }
  #pass { padding-right: 96px; }
  #toggle { position: absolute; right: 6px; top: 6px; bottom: 6px; padding: 0 12px; border: 0; border-radius: 8px;
            background: #232A35; color: #fff; font-size: 14px; }
  #submit { width: 100%; margin-top: 24px; padding: 14px; border: 0; border-radius: 10px; background: #FFB300;
            color: #0B0E13; font-size: 17px; font-weight: 700; }
  #submit:disabled { opacity: .55; }
  #status { min-height: 22px; margin-top: 16px; text-align: center; font-size: 15px; }
  .error { color: #FF7B6B; }
</style>
</head>
<body>
<main>
  <h1>Вход в rezka</h1>
  <p class="hint">Телевизор войдёт в ваш аккаунт rezka. Пароль шифруется на телефоне ключом телевизора
    и уходит только на телевизор, а с него — на сайт.</p>
  <form id="form" autocomplete="on">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" inputmode="email" required>
    <label for="pass">Пароль</label>
    <div class="field">
      <input id="pass" name="password" type="password" autocomplete="current-password" required>
      <button id="toggle" type="button">Показать</button>
    </div>
    <button id="submit" type="submit">Войти</button>
  </form>
  <div id="status" role="status"></div>
</main>
<script>
  var form = document.getElementById('form'), email = document.getElementById('email'),
      pass = document.getElementById('pass'), toggle = document.getElementById('toggle'),
      submit = document.getElementById('submit'), status = document.getElementById('status');
  var LABEL = 'rezka-tv login v1';
  var params = new URLSearchParams(location.hash.slice(1));
  var tv = params.get('tv') || '', key = params.get('k') || '', tvKey = params.get('pk') || '';

  function show(text, cls) { status.textContent = text; status.className = cls || ''; }

  var privateHost = /^(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}):\d{2,5}$/;
  var valid = privateHost.test(tv) && /^[0-9a-f]{32}$/.test(key) && /^[A-Za-z0-9_-]{87}$/.test(tvKey);
  if (!valid) {
    form.style.display = 'none';
    show('Откройте эту страницу, отсканировав QR-код на телевизоре: Rezka TV → Настройки → Войти.', 'error');
  } else if (!(window.crypto && crypto.subtle)) {
    form.style.display = 'none';
    show('Браузер не умеет шифровать. Откройте ссылку, которая написана под QR-кодом на телевизоре.', 'error');
  }

  function b64(bytes) {
    var s = '';
    new Uint8Array(bytes).forEach(function (b) { s += String.fromCharCode(b); });
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function unb64(text) {
    var s = atob(text.replace(/-/g, '+').replace(/_/g, '/'));
    var out = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
    return out;
  }
  function concat(a, b) {
    var out = new Uint8Array(a.byteLength + b.byteLength);
    out.set(new Uint8Array(a), 0);
    out.set(new Uint8Array(b), a.byteLength);
    return out;
  }

  async function seal(fields) {
    var ec = { name: 'ECDH', namedCurve: 'P-256' };
    var tvPublic = await crypto.subtle.importKey('raw', unb64(tvKey), ec, false, []);
    var mine = await crypto.subtle.generateKey(ec, true, ['deriveBits']);
    var secret = await crypto.subtle.deriveBits({ name: 'ECDH', public: tvPublic }, mine.privateKey, 256);
    var hash = await crypto.subtle.digest('SHA-256', concat(secret, new TextEncoder().encode(LABEL)));
    var aes = await crypto.subtle.importKey('raw', hash, 'AES-GCM', false, ['encrypt']);
    var iv = crypto.getRandomValues(new Uint8Array(12));
    var data = new TextEncoder().encode(JSON.stringify(fields));
    var sealed = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv, additionalData: new TextEncoder().encode(key) }, aes, data);
    var raw = await crypto.subtle.exportKey('raw', mine.publicKey);
    return { p: b64(raw), iv: b64(iv), c: b64(sealed) };
  }

  toggle.onclick = function () {
    var hidden = pass.type === 'password';
    pass.type = hidden ? 'text' : 'password';
    toggle.textContent = hidden ? 'Скрыть' : 'Показать';
  };
  form.onsubmit = function (e) {
    e.preventDefault();
    submit.disabled = true;
    show('Шифруем…');
    seal({ email: email.value.trim(), password: pass.value }).then(function (sealed) {
      location.href = 'http://' + tv + '/?k=' + key + '#' + new URLSearchParams(sealed).toString();
    }).catch(function () {
      submit.disabled = false;
      show('Не удалось зашифровать. Отсканируйте QR-код на телевизоре ещё раз.', 'error');
    });
  };
  window.addEventListener('pageshow', function () { submit.disabled = !valid; if (valid) show(''); });
</script>
</body>
</html>
