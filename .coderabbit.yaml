language: ru-RU

reviews:
  profile: assertive
  high_level_summary: true
  poem: false
  commit_status: true
  fail_commit_status: true
  auto_review:
    enabled: true
    drafts: false
  auto_approvals:
    enabled: true
  tools:
    detekt:
      enabled: true
    ruff:
      enabled: true
    actionlint:
      enabled: true
    languagetool:
      enabled: true
    gitleaks:
      enabled: true
    osvScanner:
      enabled: true
  path_instructions:
    - path: "**"
      instructions: >-
        Регламент проекта — CLAUDE.md и docs/quality-roadmap.md. Код пишет ИИ, поэтому комментарии и докстринги
        запрещены везде; никогда не предлагай их добавить. Понятность — именами и маленькими функциями.
  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "warning"
      requirements: "По-русски, в форме «Область: что сделано»."
    description:
      mode: "warning"
    custom_checks:
      - name: "Без комментариев"
        mode: "error"
        instructions: >-
          Провал, если добавленные или изменённые строки содержат комментарии любого вида: //, /* */, KDoc,
          # в Python, YAML, .properties и proguard, <!-- --> в XML, докстринги Python. Исключений нет.
      - name: "Правила тестов"
        mode: "error"
        instructions: >-
          Провал, если добавленный или изменённый тест нарушает хотя бы одно правило: ровно один assert, и он
          последний; у assert есть сообщение об ошибке; тело не длиннее 12 строк; нет setUp/tearDown,
          @Before/@After и общего состояния; нет моков, verify, fail, assertDoesNotThrow и sleep; нет констант
          и литералов прямо в assert — сначала переменная; имя теста — английское предложение с глагола;
          нет обращения к приватному через рефлексию.
      - name: "Изменение с тестами"
        mode: "error"
        instructions: >-
          Провал, если PR меняет поведение кода в app/src/main или tools без добавления или изменения тестов,
          и если PR удаляет тест вместо отключения с указанием причины.
      - name: "Радикальные зоны"
        mode: "warning"
        instructions: >-
          Предупреди, если PR затрагивает плеер (rezka/player), вход (rezka/login), ключи подписи
          или схему хранения прогресса (session, Progress, Watched): такие изменения владелец проверяет вручную.
